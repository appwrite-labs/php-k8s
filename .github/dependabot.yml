version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 10
  commit-message:
    prefix: chore
    include: scope
  groups:
    actions:
      applies-to: version-updates
      update-types: ["minor", "patch"]
      patterns:
        - "*"
    actions-security:
      applies-to: security-updates
      patterns:
        - "*"
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 10
  versioning-strategy: increase
  commit-message:
    prefix: chore
    include: scope
  ignore:
    - dependency-name: "phpunit/phpunit"
      update-types: ["version-update:semver-major"]
  groups:
    composer:
      applies-to: version-updates
      update-types: ["minor", "patch"]
      patterns:
        - "*"
    composer-security:
      applies-to: security-updates
      patterns:
        - "*"
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 10
  commit-message:
    prefix: chore
    include: scope
  groups:
    npm_and_yarn:
      applies-to: version-updates
      update-types: ["minor", "patch"]
      patterns:
        - "*"
    npm-security:
      applies-to: security-updates
      patterns:
        - "*"
